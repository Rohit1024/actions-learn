name: Local contract checks

on:
  push:
    branches: [main, master]
    paths:
      - examples/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - Taskfile.yml
      - tsconfig.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/**
      - .agents/skills/teach/**
  pull_request:
    paths:
      - examples/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - Taskfile.yml
      - tsconfig.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/**
      - .agents/skills/teach/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.53.1'
      - run: task setup
      - run: task check
        env:
          # Ubuntu's AppArmor profile permits the runner's installed Chrome.
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
