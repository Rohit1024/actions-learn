# Inactive template: activating this workflow proposes release PRs.
name: Pre-built release automation recipe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  propose-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
