name: Consume our own composite action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./examples/project-setup-action
        id: project
        with:
          node-version: '24'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
