name: Module 2 deliberately broken mapping
description: The same script with a misspelled inner output name
inputs:
  name:
    description: Nonempty single-line recipient
    default: World
outputs:
  greeting:
    description: Deliberately maps an output the script never publishes
    value: ${{ steps.greet.outputs.greetings }}
runs:
  using: composite
  steps:
    - id: greet
      shell: bash
      env:
        GREETING_NAME: ${{ inputs.name }}
      run: bash "$GITHUB_ACTION_PATH/greet.sh"
