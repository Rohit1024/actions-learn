name: Fixture project setup
description: Shared Node selection only; caller owns checkout and project commands.
inputs:
  node-version:
    description: Node selector for the project commands.
    default: '24'
outputs:
  node-version:
    description: Installed Node version.
    value: ${{ steps.node.outputs.node-version }}
runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
