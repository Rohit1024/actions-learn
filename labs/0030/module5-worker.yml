name: Module 5 reusable evidence worker
on:
  workflow_call:
    inputs:
      kind:
        type: string
        required: true
      candidate:
        type: string
        required: true
      fail-kind:
        type: string
        default: none
    outputs:
      artifact:
        description: Exact artifact name; evidence file is separate from this string.
        value: ${{ jobs.worker.outputs.artifact }}
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact }}
    env:
      KIND: ${{ inputs.kind }}
      CANDIDATE: ${{ inputs.candidate }}
      FAIL_KIND: ${{ inputs.fail-kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./labs/0030/setup
      - name: Validate worker selector
        shell: bash
        run: |
          case "$KIND" in build|test) ;; *) printf '%s\n' 'unknown worker kind' >&2; exit 1 ;; esac
          case "$FAIL_KIND" in none|build|test) ;; *) printf '%s\n' 'unknown fail-kind' >&2; exit 1 ;; esac
      - name: Build project fixture
        if: inputs.kind == 'build'
        shell: bash
        env:
          WORK_DIR: ${{ runner.temp }}/module5-build
        run: node labs/0030/build.cjs
      - name: Test project behavior
        if: inputs.kind == 'test'
        shell: bash
        run: node --test labs/0030/domain.test.cjs
      - id: evidence
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/module5-evidence
        run: node labs/0030/emit.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: ${{ runner.temp }}/module5-evidence/${{ inputs.kind }}.json
          if-no-files-found: error
          retention-days: 1
