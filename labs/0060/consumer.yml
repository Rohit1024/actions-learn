name: Module 3 local release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: candidate
        uses: ./labs/0060/package
        with:
          component: docs
          channel: stable
      - name: Assert candidate public interface
        env:
          RELEASE_KEY: ${{ steps.candidate.outputs.release-key }}
        shell: bash
        run: test "$RELEASE_KEY" = docs-stable
