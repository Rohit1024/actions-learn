name: Module 6 local candidate consumer
on:
  workflow_dispatch:
permissions: {}
jobs:
  consumer:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing course pin
        with:
          persist-credentials: false
      - id: candidate
        uses: ./labs/0035
        with:
          name: Ada
      - env:
          GREETING: ${{ steps.candidate.outputs.greeting }}
        shell: bash
        run: test "$GREETING" = 'Hello, Ada!'
