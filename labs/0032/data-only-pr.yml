name: Module 6 title as data
on:
  pull_request:
permissions: {}
jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Count supplied text without evaluating it
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          python3 -c 'import os; print("title characters:", len(os.environ["TITLE"]))'
