name: Module 9 bounded file inspection
description: Inspect a small UTF-8 file in the caller workspace without uploading it.
inputs:
  file:
    description: Existing regular UTF-8 file relative to the caller workspace.
    required: true
  max-bytes:
    description: Maximum bytes to read, from 1 through 1048576.
    default: '1024'
outputs:
  bytes:
    description: Byte length of the accepted file, as decimal text.
  lines:
    description: Number of text lines, as decimal text.
runs:
  using: docker
  image: Dockerfile
  args:
    - ${{ inputs.file }}
    - ${{ inputs.max-bytes }}
