name: Module 9 Docker interface
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inspect
        uses: ./labs/0053/action
        with:
          file: labs/0053/fixtures/release notes.txt
          max-bytes: '1024'
      - name: Assert mounted file results
        env:
          BYTE_COUNT: ${{ steps.inspect.outputs.bytes }}
          LINE_COUNT: ${{ steps.inspect.outputs.lines }}
        shell: bash
        run: |
          test "$BYTE_COUNT" = 11
          test "$LINE_COUNT" = 2
