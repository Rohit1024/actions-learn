name: Module 9 maintained setup composite
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: project
        uses: ./labs/0051/action
        with:
          node-version: '24'
          cache-dependency-path: package-lock.json
      - name: Assert the installed runtime output
        env:
          INSTALLED_NODE: ${{ steps.project.outputs.node-version }}
        shell: bash
        run: |
          test -n "$INSTALLED_NODE"
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
      - run: npm ci
      - run: npm test
