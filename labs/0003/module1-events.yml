name: Module 1 event selection

on:
  push:
    branches: [main]
    paths: ['examples/**', '.github/workflows/module1-events.yml']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['examples/**', '.github/workflows/module1-events.yml']
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run the optional check
        type: boolean
        default: false

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect only the fields this lesson needs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          printf 'event=%s\nref=%s\nbase=%s\nhead=%s\n' \
            "$EVENT_NAME" "$EVENT_REF" "$BASE_REF" "$PR_HEAD"
      - name: Optional manual check
        if: github.event_name == 'workflow_dispatch' && inputs.run_checks
        run: printf '%s\n' 'optional check selected'
