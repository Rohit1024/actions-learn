name: Healthy fixture
description: Output bridge example
inputs:
  name:
    default: Ada
outputs:
  greeting:
    description: Greeting
    value: ${{ steps.greet.outputs.greeting }}
runs:
  using: composite
  steps:
    - id: greet
      shell: bash
      run: printf '%s\n' 'greeting=Hello, Ada!' >> "$GITHUB_OUTPUT"
