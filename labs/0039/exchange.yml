# Inactive, no installation or artifact service is invoked by host tests.
name: Module 7 setup and named exchange
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:action
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module7-action-bundle
          path: examples/typescript-action/dist/index.cjs
          if-no-files-found: error
          retention-days: 3
  consume:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module7-action-bundle
          path: received
          digest-mismatch: error
      - run: test -s received/index.cjs
